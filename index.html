    <h1 class="text-center mt-3 mb-4">Calcula tu Índice de Masa Corporal</h1>

    <div class="container col-12 col-lg-10">
        <div class="row justify-content-center rounded-5 pt-4 mb-3 mb-lg-4 shadow">
          <div class="col-11 col-sm-10 col-md-8 col-lg-5">
            <div class="card text-center rounded-5 border-0">
              <img id="imagensojo" src="src/img/IMG-20250409-WA0028 (5).jpg" 
                   class="rounded-circle mx-auto shadow">
              <div class="card-body">
                <h2 class="text-center nombre">Dr. Javier Sojo Vizcaíno</h2>
                <p class="card-text mb-lg-2 descripcion">Medico egresado de la Universidad Metropolitana de Barranquilla
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>

    <div class="row justify-content-center my-2 my-lg-1">
        <div class="col-11 col-sm-10 col-md-9 col-lg-9">
            <form class="p-3 bg-light border rounded-5 shadow">
                <div class="mb-3">
                    <label for="exampleInputEmail1" class="form-label">Introduce tu peso en KG</label>
                    <input type="number" class="form-control" id="peso" step="any">
                    <!-- <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div> -->
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Introduce tu altura en Mts o Cm</label>
                    <input type="number" class="form-control" id="altura" step="any">
                </div>
                <button type="button" id="calcular" class="btn btn-primary">Calcular</button>
            </form>
        </div>
    </div>
